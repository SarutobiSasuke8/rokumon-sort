name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic tests
        run: npm test
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser smoke test
        run: npm run smoke
