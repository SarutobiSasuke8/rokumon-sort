.rs, .rs * { box-sizing: border-box; }
.rs {
  height: 100%;
  min-height: 100%;
  color: #f3eadb;
  background:
    radial-gradient(ellipse at 18% -10%, rgba(224, 162, 74, 0.16), transparent 46%),
    radial-gradient(ellipse at 100% 100%, rgba(196, 92, 50, 0.12), transparent 42%),
    linear-gradient(180deg, #16130f 0%, #100e0c 40%, #0c0a09 100%);
  font-family: "Segoe UI", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.rs button { font-family: inherit; color: inherit; cursor: pointer; }
.rs button:disabled { cursor: default; }
.rs-display { font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif; }
.rs-screen {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
}
.rs-menu, .rs-select {
  width: min(560px, 100%);
  margin: 0 auto;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.rs-hero { text-align: center; padding: 12px 0 8px; }
.rs-crest { width: 76px; height: 76px; display: block; margin: 0 auto 8px; }
.rs-kicker {
  margin: 0;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  font-size: 11px;
  color: #e0a24a;
}
.rs h1 {
  margin: 6px 0 0;
  font-weight: 500;
  font-size: clamp(34px, 8vw, 52px);
  letter-spacing: 0.04em;
  line-height: 0.95;
}
.rs-sub { margin: 8px 0 0; color: #a89884; font-size: 15px; line-height: 1.45; }
.rs-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
.rs-btn {
  appearance: none;
  border-radius: 999px;
  min-height: 50px;
  padding: 0 18px;
  border: 1px solid rgba(224, 162, 74, 0.38);
  background: linear-gradient(180deg, #2c261f, #1a1612);
  color: #f3eadb;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.rs-btn.primary {
  background: linear-gradient(180deg, #f0c56e, #c4843a);
  color: #2a1604;
  border-color: #f3d7a2;
}
.rs-btn.ghost { background: transparent; }
.rs-btn:focus-visible, .rs-tool:focus-visible, .rs-vial:focus-visible, .rs-gate:focus-visible {
  outline: 2px solid #e0a24a;
  outline-offset: 2px;
}
.rs-meta {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: #a89884;
  font-size: 13px;
  padding-top: 16px;
}
.rs-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.rs-head h2 { margin: 0; font-size: 28px; font-weight: 500; }
.rs-iconbtn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 1px solid rgba(224, 162, 74, 0.35);
  background: #1a1612;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.rs-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  overflow: auto;
  padding-bottom: 8px;
}
@media (min-width: 720px) {
  .rs-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
.rs-gate {
  min-height: 78px;
  border-radius: 16px;
  border: 1px solid rgba(243, 234, 219, 0.12);
  background: rgba(255, 255, 255, 0.03);
  padding: 8px 6px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.rs-gate strong { font-size: 16px; font-weight: 650; }
.rs-gate em { font-style: normal; font-size: 10px; letter-spacing: 0.04em; color: #a89884; }
.rs-gate.is-locked { opacity: 0.42; }
.rs-gate.is-done { border-color: rgba(224, 162, 74, 0.55); }
.rs-stars { display: flex; gap: 2px; height: 12px; }
.rs-stars svg { width: 12px; height: 12px; }
.rs-play {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  width: min(980px, 100%);
  margin: 0 auto;
}
.rs-playhead { display: flex; align-items: center; gap: 10px; }
.rs-playhead .rs-titles { flex: 1; min-width: 0; }
.rs-playhead h2 {
  margin: 0;
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rs-playhead p { margin: 2px 0 0; color: #a89884; font-size: 13px; }
.rs-moves {
  text-align: right;
  min-width: 64px;
}
.rs-moves b {
  display: block;
  font-size: 26px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.rs-moves span { color: #a89884; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
.rs-coach {
  margin: 10px 0 0;
  color: #d9c7a4;
  font-size: 13px;
  line-height: 1.4;
}
.rs-board-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: safe center;
  justify-content: center;
  padding: 12px 0 8px;
  overflow: auto;
}
.rs-stream {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 4;
}
.rs-board {
  width: min(100%, 520px);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(56px, 72px));
  gap: 14px 8px;
  justify-content: center;
  align-items: end;
  position: relative;
  z-index: 1;
}
.rs-vial {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 0;
  width: clamp(56px, 16vw, 78px);
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(var(--lift, 0px)) rotate(var(--tilt, 0deg));
  transform-origin: 50% 100%;
  transition: transform 0.16s ease;
  z-index: 1;
}
.rs-vial.is-anim { transition: none; z-index: 5; }
.rs-vial.is-selected { --lift: -10px; z-index: 3; }
.rs-vial.is-cursor .rs-body { box-shadow: 0 0 0 2px rgba(224, 162, 74, 0.85); }
.rs-vial.is-shake { animation: rs-shake 0.36s ease; }
.rs-vial.is-hint-from .rs-neck, .rs-vial.is-hint-to .rs-neck { box-shadow: 0 0 0 3px rgba(224, 162, 74, 0.8); }
.rs-vial.is-hint-to .rs-body { box-shadow: 0 0 0 2px rgba(31, 168, 106, 0.85); }
.rs-neck {
  width: 42%;
  height: 15px;
  border: 2px solid rgba(243, 234, 219, 0.72);
  border-bottom: none;
  border-radius: 7px 7px 0 0;
  background: linear-gradient(90deg, rgba(255,255,255,0.2), rgba(255,255,255,0.04));
  position: relative;
  z-index: 2;
}
.rs-body {
  width: 100%;
  height: clamp(96px, 20dvh, 168px);
  margin-top: -2px;
  border-radius: 14px 14px 28px 28px;
  position: relative;
  background: rgba(6, 5, 4, 0.45);
  overflow: hidden;
  box-shadow: 0 12px 18px rgba(0, 0, 0, 0.35);
}
.rs-stack {
  position: absolute;
  left: 5px;
  right: 5px;
  bottom: 7px;
  top: 8px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.rs-layer {
  width: 100%;
  height: calc(var(--frac) * 25%);
  position: relative;
  background:
    radial-gradient(circle at 30% 18%, rgba(255,255,255,0.38), transparent 42%),
    linear-gradient(180deg, var(--hi), var(--mid) 48%, var(--deep));
  flex: 0 0 auto;
}
.rs-layer.is-hidden {
  background: repeating-linear-gradient(135deg, #3a332b, #3a332b 6px, #2a241d 6px, #2a241d 12px);
}
.rs-layer.is-top::before {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  top: -3px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.32);
}
.rs-mark {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 16px;
  height: 16px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 1px rgba(255,255,255,0.75));
}
.rs-glass {
  pointer-events: none;
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 2px solid rgba(243, 234, 219, 0.62);
  background: linear-gradient(90deg, rgba(255,255,255,0.22), transparent 30%, transparent 72%, rgba(255,255,255,0.08));
  box-shadow: inset 0 -14px 16px rgba(0,0,0,0.2);
}
.rs-vial.is-sealed .rs-neck {
  background: linear-gradient(180deg, #f0c56e, #c4843a);
  border-color: #f3d7a2;
}
.rs-vial.is-sealed .rs-neck::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  transform: translateX(-50%);
  background: #6a3a12;
}
.rs-index { margin-top: 6px; font-size: 11px; letter-spacing: 0.08em; color: #a89884; }
.rs-tools {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding-top: 8px;
}
.rs-tool {
  min-height: 54px;
  border-radius: 16px;
  border: 1px solid rgba(224, 162, 74, 0.32);
  background: #1a1612;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #f3eadb;
}
.rs-tool svg { width: 18px; height: 18px; }
.rs-tool:disabled { opacity: 0.38; }
.rs-tool b { font-weight: 700; color: #e0a24a; }
.rs-modal {
  position: absolute;
  inset: 0;
  z-index: 8;
  background: rgba(8, 6, 5, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}
.rs-card {
  width: min(420px, 100%);
  background: linear-gradient(180deg, #2a231c, #16130f);
  border: 1px solid rgba(224, 162, 74, 0.45);
  border-radius: 22px;
  padding: 22px 18px 16px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.45);
  text-align: center;
}
.rs-card h3 { margin: 6px 0 0; font-size: 32px; font-weight: 500; }
.rs-card p { color: #d9cbb8; font-size: 15px; line-height: 1.5; }
.rs-card .rs-actions { margin-top: 14px; }
.rs-rules { text-align: left; margin: 8px 0 0; padding: 0; list-style: none; }
.rs-rules li { margin: 0 0 8px; color: #e7dccb; font-size: 14px; line-height: 1.45; }
.rs-rules b { color: #e0a24a; font-weight: 650; }
.rs-bigstars { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
.rs-bigstars svg { width: 28px; height: 28px; }
.rs-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
@keyframes rs-shake {
  0%, 100% { transform: translateY(var(--lift, 0px)) rotate(var(--tilt, 0deg)); }
  25% { transform: translateY(var(--lift, 0px)) translateX(-5px) rotate(var(--tilt, 0deg)); }
  75% { transform: translateY(var(--lift, 0px)) translateX(5px) rotate(var(--tilt, 0deg)); }
}
@media (prefers-reduced-motion: reduce) {
  .rs-vial, .rs-vial.is-shake { transition: none; animation: none; }
}
